apiVersion: v1
kind: ConfigMap
metadata:
  name: kk-payments-config
  namespace: kijani-project
data:
  APP_PORT: "3001"
  DB_HOST: postgres
  DB_PORT: "5432"
  LOG_LEVEL: info
  MAX_CONNECTIONS: "10"
  NODE_ENV: production
 
  RECEIPT_BUCKET: kk-payments-receipts-staging
  S3_ENDPOINT: http://host.minikube.internal:4569
  RECEIPT_EVENTS_ENABLED: "true"
